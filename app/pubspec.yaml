name: community_rashan
description: "Community Rashan — a neighbourhood group-buying grocery app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2        # simple state management for Phase 1
  google_fonts: ^6.2.1    # Baloo 2 + Mukta (Devanagari + Latin)
  intl: ^0.19.0           # ₹ number formatting (en_IN)

  # --- Firebase: Google sign-in + Cloud Firestore ---------------------------
  # The app still runs on sample data until you run `flutterfire configure`
  # (see docs/FIREBASE_SETUP.md); at runtime it falls back to offline/mock mode
  # whenever Firebase is not configured.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
